name: Release smoke

"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release-assets:
    name: Verify release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15
          - macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: bash .github/scripts/verify-release-assets.sh "$RELEASE_TAG" "$GITHUB_REPOSITORY"
