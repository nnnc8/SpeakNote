name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting a bug. Do not attach private recordings,
        transcripts, API keys, or other credentials.
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "For example: macOS 15.5"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: SpeakNote version or commit
      placeholder: "For example: 0.1.0 or a commit SHA"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: >-
        Optional. Paste only logs or screenshots you have reviewed and redacted.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I removed private audio, transcripts, credentials, and personal data.
          required: true
