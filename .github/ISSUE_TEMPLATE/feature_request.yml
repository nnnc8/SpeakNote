name: Feature request
description: Suggest a focused improvement to SpeakNote.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Please describe the user problem before proposing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest observable improvement that would solve it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Include workarounds or simpler approaches you tried.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no private recordings, transcripts, or credentials.
          required: true
